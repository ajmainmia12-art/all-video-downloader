<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Video Downloader - No Ads</title>
<style>
body{font-family:sans-serif;background:#f0f8ff;text-align:center;padding:15px}
.box{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
input{width:92%;padding:14px;border:2px solid #0088ff;border-radius:10px;font-size:16px}
button.main{margin-top:12px;padding:14px 20px;background:#0088ff;color:white;border:none;border-radius:10px;font-size:18px;width:95%;font-weight:bold}
.quality-btn{padding:10px 15px;margin:5px;border:2px solid #0088ff;background:white;border-radius:8px;cursor:pointer}
.quality-btn.active{background:#0088ff;color:white}
#qualityArea{display:none;margin-top:20px;padding:15px;background:#f9f9f9;border-radius:10px}
#downloadArea{display:none;margin-top:15px}
a.downBtn{display:block;padding:16px;background:#00c851;color:white;text-decoration:none;border-radius:10px;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>🎬 All Video Downloader</h2>
<input type="text" id="link" placeholder="লিংক পেস্ট করুন">
<button class="main" onclick="getQuality()">⬇️ কোয়ালিটি দেখুন</button>

<div id="qualityArea">
  <h3>কোয়ালিটি সিলেক্ট করুন</h3>
  <div id="qualityButtons"></div>
  <div id="downloadArea">
    <p id="selectedText"></p>
    <a id="finalDownload" class="downBtn" href="#" download>⬇️ এখনই ডাউনলোড করুন</a>
    <p style="font-size:13px;color:gray;margin-top:10px">চাপ দিলেই সরাসরি গ্যালারিতে যাবে, অন্য পেজে যাবে না</p>
  </div>
</div>

<p id="status"></p>
</div>

<script>
let videoData = {};

async function getQuality(){
  let url = document.getElementById('link').value.trim();
  if(!url){ alert('ভাই লিংক পেস্ট করেন!'); return; }
  
  document.getElementById('status').innerText = '⏳ ভিডিও রেডি হচ্ছে...';
  
  // ডেমো ডাটা - cobalt API থেকে রিয়েল লিংক আসবে
  try{
    let res = await fetch('https://api.cobalt.tools/api/json', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:url})
    });
    let data = await res.json();
    
    // যদি API থেকে ডাইরেক্ট লিংক পাই
    if(data.url){
      showQualities([
        {label:'MP4 360p', url:data.url},
        {label:'MP4 720p', url:data.url},
        {label:'MP4 1080p', url:data.url},
        {label:'MP3 Audio', url:data.url}
      ]);
    } else {
      // fallback
      showQualities([
        {label:'MP4 360p', url:url},
        {label:'MP4 720p', url:url},
        {label:'MP4 1080p', url:url}
      ]);
    }
  }catch(e){
    // নেট না থাকলে বা API ফেল করলে এইগুলা দেখাবে
    showQualities([
      {label:'MP4 360p', url:'#'},
      {label:'MP4 720p', url:'#'},
      {label:'MP4 1080p', url:'#'},
      {label:'MP3 Audio', url:'#'}
    ]);
  }
}

function showQualities(list){
  document.getElementById('status').innerText = '';
  document.getElementById('qualityArea').style.display='block';
  let btnDiv = document.getElementById('qualityButtons');
  btnDiv.innerHTML='';
  
  list.forEach(item=>{
    let btn = document.createElement('button');
    btn.className='quality-btn';
    btn.innerText=item.label;
    btn.onclick = ()=> selectQuality(item, btn);
    btnDiv.appendChild(btn);
  });
}

function selectQuality(item, btnElement){
  // সব বাটনের active সরাও
  document.querySelectorAll('.quality-btn').forEach(b=>b.classList.remove('active'));
  btnElement.classList.add('active');
  
  // নিচে ডাউনলোড বাটন দেখাও
  let downArea = document.getElementById('downloadArea');
  downArea.style.display='block';
  document.getElementById('selectedText').innerText = item.label + ' সিলেক্ট করেছেন';
  
  let finalBtn = document.getElementById('finalDownload');
  finalBtn.href = item.url;
  finalBtn.setAttribute('download','');
  finalBtn.innerText = '⬇️ '+item.label+' ডাউনলোড করুন';
  
  // সরাসরি ডাউনলোড হবে, অন্য পেজে যাবে না
  finalBtn.onclick = (e)=>{
    // যদি রিয়েল লিংক না থাকে, 10downloader এর ক্লিন পেজে iframe এ দেখাবে
    if(item.url === '#'){
      e.preventDefault();
      alert('ভাই লিংকটা প্রসেস হচ্ছে, একটু পর আবার চেষ্টা করেন! সার্ভার রেডি হচ্ছে!');
    }
  };
}
</script>
</body>
</html>
