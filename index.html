<!-- ===== ভাই ৩টা ডাউনলোড বাটন একসাথে - কপি করে বসান ===== -->
<style>
  .dl-row { display:flex; gap:10px; margin-top:15px; }
  .dl-btn { flex:1; background:#00c853; color:white; border:none; padding:14px 5px; border-radius:12px; font-size:15px; font-weight:bold; cursor:pointer; line-height:1.3; }
  .dl-btn:active { background:#009624; }
  .dl-btn small { display:block; font-size:12px; font-weight:normal; opacity:0.9; }
</style>

<div class="dl-row">
  <button class="dl-btn" onclick="downloadVideo('360')">360p <small>⬇️ মেমোরিতে</small></button>
  <button class="dl-btn" onclick="downloadVideo('720')">720p <small>⬇️ মেমোরিতে</small></button>
  <button class="dl-btn" onclick="downloadVideo('1080')">1080p <small>⬇️ মেমোরিতে</small></button>
</div>

<div class="dl-row" style="margin-top:10px;">
  <button class="dl-btn" style="background:#ff3d00" onclick="downloadVideo('mp3')">🎵 MP3 Audio <small>⬇️ মেমোরিতে</small></button>
  <button class="dl-btn" style="background:#2962ff" onclick="shareApp()">🚀 Share করে ভাইরাল করুন</button>
</div>

<script>
// ভাই এই ৩টা ফাংশন একসাথে কাজ করবে
let videoLinks = {}; // API থেকে লিংক আসলে এখানে জমা হবে

function downloadVideo(quality) {
  const url = videoLinks[quality];
  if(!url) { alert('ভাই আগে ভিডিও লিংক পেস্ট করে Search দিন!'); return; }
  
  // সরাসরি মেমোরিতে ডাউনলোড
  const a = document.createElement('a');
  a.href = url;
  a.download = `video-${quality}.mp4`;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function shareApp() {
  if(navigator.share){
    navigator.share({title:'All Video Downloader', text:'এই অ্যাপ দিয়ে ১ চাপে ভিডিও মেমোরিতে নামে! 🔥', url: window.location.href});
  } else {
    prompt('লিংক কপি করে শেয়ার করুন:', window.location.href);
  }
}

// উদাহরণ: API থেকে লিংক পেলে এইভাবে সেট করবেন
// videoLinks = { '360': 'https://...360.mp4', '720': 'https://...720.mp4', '1080': 'https://...1080.mp4', 'mp3': 'https://...mp3' };
</script>
